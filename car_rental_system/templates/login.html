{% extends 'layout.html' %}
{% block title %}Login - DriveEase{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-80">
            <div class="col-md-5">
                <div class="auth-card">
                    <div class="auth-header text-center mb-4">
                        <i class="bi bi-car-front-fill auth-logo-icon"></i>
                        <h3 class="fw-bold mt-2">Welcome Back</h3>
                        <p class="text-muted">Login to your DriveEase account</p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-accent w-100 btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </button>
                    </form>

                    <p class="text-center mt-4 text-muted">
                        Don't have an account?
                        <a href="{{ url_for('register') }}" class="text-accent fw-semibold">Register here</a>
                    </p>
                    <p class="text-center text-muted small">
                        <a href="{{ url_for('admin_login') }}" class="text-muted">Admin Login →</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
