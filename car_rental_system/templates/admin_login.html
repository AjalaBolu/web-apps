{% extends 'layout.html' %}
{% block title %}Admin Login - DriveEase{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-80">
            <div class="col-md-4">
                <div class="auth-card admin-auth-card">
                    <div class="auth-header text-center mb-4">
                        <i class="bi bi-shield-lock-fill auth-logo-icon text-warning"></i>
                        <h3 class="fw-bold mt-2">Admin Portal</h3>
                        <p class="text-muted">Restricted access — administrators only</p>
                    </div>

                    <form method="POST" action="{{ url_for('admin_login') }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="admin" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Admin password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 btn-lg fw-bold">
                            <i class="bi bi-shield-check me-2"></i>Admin Login
                        </button>
                    </form>

                    <p class="text-center mt-4 text-muted small">
                        Default: <code>admin</code> / <code>admin123</code>
                    </p>
                    <p class="text-center">
                        <a href="{{ url_for('login') }}" class="text-muted small">← Customer Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
