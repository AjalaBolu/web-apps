{% extends 'layout.html' %}
{% block title %}Register - DriveEase{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-80">
            <div class="col-md-6">
                <div class="auth-card">
                    <div class="auth-header text-center mb-4">
                        <i class="bi bi-person-plus-fill auth-logo-icon"></i>
                        <h3 class="fw-bold mt-2">Create Account</h3>
                        <p class="text-muted">Join DriveEase and start renting today</p>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="text" name="phone" class="form-control" placeholder="+1 555 000 0000">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Repeat your password" required>
                            </div>
                            <div id="password-match-msg" class="form-text"></div>
                        </div>
                        <button type="submit" class="btn btn-accent w-100 btn-lg">
                            <i class="bi bi-person-check me-2"></i>Create Account
                        </button>
                    </form>

                    <p class="text-center mt-4 text-muted">
                        Already have an account?
                        <a href="{{ url_for('login') }}" class="text-accent fw-semibold">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Live password match feedback
document.getElementById('confirm_password').addEventListener('input', function() {
    const p1 = document.getElementById('password').value;
    const p2 = this.value;
    const msg = document.getElementById('password-match-msg');
    if (p2.length === 0) { msg.textContent = ''; return; }
    if (p1 === p2) {
        msg.textContent = '✓ Passwords match';
        msg.style.color = 'green';
    } else {
        msg.textContent = '✗ Passwords do not match';
        msg.style.color = 'red';
    }
});
</script>
{% endblock %}
