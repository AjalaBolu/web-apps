{% extends "base.html" %}
{% set show_sidebar = false %}
{% set show_footer = false %}

{% block title %}Login — MindSpace{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card fade-up">

    <!-- Brand -->
    <div class="brand">
      <i class="bi bi-heart-pulse-fill gold-text" style="font-size:2rem;"></i>
      <h2 class="mt-2">Welcome Back</h2>
      <p class="dim-text" style="font-size:0.88rem;">Sign in to your MindSpace account</p>
    </div>

    <!-- Form -->
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control"
               placeholder="your@email.com" required autocomplete="email" />
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" id="password" class="form-control"
               placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="remember" id="remember"
                 style="background-color:var(--black-hover); border-color:var(--border);" />
          <label class="form-check-label dim-text" for="remember" style="font-size:0.85rem;">
            Remember me
          </label>
        </div>
        <a href="#" class="dim-text" style="font-size:0.85rem;">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-gold w-100 py-2">
        Sign In <i class="bi bi-arrow-right ms-1"></i>
      </button>
    </form>

    <hr class="gold-divider" />

    <p class="text-center dim-text mb-0" style="font-size:0.88rem;">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="gold-text fw-500">Create one free</a>
    </p>

    <p class="text-center mt-2" style="font-size:0.78rem;">
      <a href="{{ url_for('auth.admin_login') }}" class="dim-text">Admin login →</a>
    </p>

  </div>
</div>
{% endblock %}
