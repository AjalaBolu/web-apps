<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — MindSpace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="position-fixed top-0 end-0 p-3" style="z-index:9999;">
    {% for cat, msg in messages %}
    <div class="alert alert-{{ cat }} alert-dismissible shadow">
      {{ msg }}
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}

<div class="auth-wrapper">
  <div class="auth-card fade-up">
    <div class="brand">
      <i class="bi bi-shield-fill-check gold-text" style="font-size:2.5rem;"></i>
      <h2 class="mt-2">Admin Portal</h2>
      <p class="dim-text" style="font-size:0.85rem;">MindSpace Administration</p>
    </div>

    <form method="POST" action="{{ url_for('auth.admin_login') }}">
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control"
               placeholder="admin@mentalhealth.com" required />
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control"
               placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-gold w-100 py-2">
        <i class="bi bi-shield-lock me-1"></i> Admin Sign In
      </button>
    </form>

    <hr class="gold-divider" />
    <p class="text-center mb-0">
      <a href="{{ url_for('main.index') }}" class="dim-text" style="font-size:0.82rem;">
        ← Back to site
      </a>
    </p>

    <div class="mt-3 p-3 rounded text-center"
         style="background:var(--gold-glow); border:1px solid var(--border); font-size:0.78rem; color:var(--white-dim);">
      Default: <span class="gold-text">admin@mentalhealth.com</span> /
      <span class="gold-text">Admin@1234</span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
